    <path d="M84 91c20-13 52-13 72 0" fill="none" stroke="#0b1220" stroke-width="4.4" stroke-linecap="round"/>
    <path d="M88 95c16-7 26-8 40-8" fill="none" stroke="url(#sc-hatch)" stroke-width="4" stroke-linecap="round"/>
    <circle cx="101" cy="108" r="5.2" fill="#0b1220"/>
    <circle cx="139" cy="108" r="5.2" fill="#0b1220"/>
    <circle cx="102.8" cy="106.2" r="1.5" fill="#f2f6ff"/>
    <circle cx="140.8" cy="106.2" r="1.5" fill="#f2f6ff"/>

