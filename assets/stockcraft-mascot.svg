      <circle cx="64" cy="21" r="6.5" fill="#f0a413"/>
      <path d="M7 57l21-24 13 13 9-9 24 20z" fill="#e9f0ff" opacity="0.92"/>
      <path d="M7 57l21-24 13 13 9-9 24 20" fill="none" stroke="#0b1220" stroke-width="1.4" opacity="0.5"/>
    </g>

