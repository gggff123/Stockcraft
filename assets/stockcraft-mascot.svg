    <ellipse cx="156" cy="188" rx="23" ry="14" fill="#f2f6ff" stroke="#0b1220" stroke-width="3" transform="rotate(-14 156 188)"/>
    <path d="M141 184c5-3 11-3 16 0M145 191c4-2 8-2 12 0" fill="none" stroke="url(#sc-hatch)" stroke-width="3" stroke-linecap="round"/>
