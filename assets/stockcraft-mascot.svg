<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240" role="img" aria-label="Stockcraft mascot: a cross-hatched ink gorilla holding a photograph">
  <title>Stockcraft gorilla mascot</title>
  <desc>An original ink-drawn gorilla with cross-hatched shading, holding a framed photograph on a Stockcraft blue badge.</desc>
  <defs>
    <linearGradient id="sc-blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2b5ce6"/>
      <stop offset="0.55" stop-color="#1a45c4"/>
      <stop offset="1" stop-color="#0b1f57"/>
    </linearGradient>
    <pattern id="sc-hatch" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(38)">
      <line x1="0" y1="0" x2="0" y2="5" stroke="#0b1220" stroke-width="1.05" opacity="0.72"/>
    </pattern>
    <pattern id="sc-hatch-light" width="4" height="4" patternUnits="userSpaceOnUse" patternTransform="rotate(-36)">
      <line x1="0" y1="0" x2="0" y2="4" stroke="#0b1220" stroke-width="0.8" opacity="0.45"/>
    </pattern>
    <path id="sc-shoulders" d="M36 216c3-36 18-60 44-70l14-6h52l14 6c26 10 41 34 44 70z"/>
    <path id="sc-head" d="M120 36c41 0 68 28 68 68 0 34-15 57-34 68-21 12-47 12-68 0-19-11-34-34-34-68 0-40 27-68 68-68z"/>
    <path id="sc-muzzle" d="M82 133c9-12 67-12 76 0 7 10 1 33-38 33s-45-23-38-33z"/>
  </defs>

  <rect width="240" height="240" rx="52" fill="url(#sc-blue)"/>
  <g opacity="0.22" stroke="#cfe0ff" stroke-width="1.4" fill="none">
    <path d="M22 186c18 16 36 24 54 26"/>
    <path d="M12 150c10 8 20 13 30 15"/>
    <path d="M206 70c6 5 11 11 15 18"/>
    <path d="M188 44c8 4 15 9 21 16"/>
  </g>

