    <use href="#sc-shoulders" fill="url(#sc-hatch-light)"/>
    <use href="#sc-shoulders" fill="none" stroke="#0b1220" stroke-width="3" stroke-linejoin="round"/>

    <circle cx="59" cy="104" r="19" fill="#f2f6ff" stroke="#0b1220" stroke-width="3"/>
