[package]
name = "stockcraft"
version = "0.1.0"
description = "Stockcraft — multi-source free image discovery desktop app"
authors = ["Stockcraft"]
edition = "2021"
rust-version = "1.90"

[lib]
name = "stockcraft_lib"
# Desktop-only build: the Tauri mobile cdylib/staticlib targets are not used.
# Building a cdylib on the x86_64-pc-windows-gnu toolchain makes MinGW's ld
# generate an export table that overflows (error: export ordinal too large),
# so keep only the rlib consumed by the binary and the test harness.
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "sync", "fs", "io-util"] }
tokio-util = { version = "0.7", features = ["rt"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream", "gzip", "charset"] }
futures-util = "0.3"
rusqlite = { version = "0.40", features = ["bundled"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
url = "2"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
dirs = "7"
rfd = "0.17"
opener = "0.9"
fs2 = "0.4"
async-trait = "0.1"
http = "1"

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
