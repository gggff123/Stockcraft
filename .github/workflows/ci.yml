name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Minimum permissions: CI only needs to read the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  frontend:
    name: Frontend (typecheck + tests)
    runs-on: windows-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Production frontend build
        run: npm run build

  backend:
    name: Backend (fmt, clippy, tests)
    runs-on: windows-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The project is built and verified with the GNU toolchain. On MSVC, build.rs
      # links the Tauri resource archive into every target (so the lib-test harness
      # gets the v6 manifest), while tauri-build also links it into the binary with
      # rustc-link-arg-bins; CVTRES then fails with a duplicate-resource error.
      - name: Set up Rust (GNU toolchain)
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable-x86_64-pc-windows-gnu
          components: rustfmt, clippy

      - name: Put MinGW-w64 on PATH
        shell: pwsh
        run: |
          foreach ($dir in @('C:\mingw64\bin', 'C:\msys64\mingw64\bin')) {
            if (Test-Path (Join-Path $dir 'x86_64-w64-mingw32-gcc.exe')) {
              Add-Content -Path $env:GITHUB_PATH -Value $dir
              Write-Host "Using MinGW from $dir"
              return
            }
          }
          throw 'No MinGW-w64 toolchain found on the runner.'

      - name: Cache Cargo build artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            src-tauri/target
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ runner.os }}-gnu-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-gnu-

      - name: Check formatting
        working-directory: src-tauri
        run: cargo fmt --check

      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: Run tests
        working-directory: src-tauri
        run: cargo test
